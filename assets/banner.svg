<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }

      /* Animated Waveform and Orbs */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-15px) scale(1.04); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(18px) scale(0.96); }
      }
      @keyframes pulseSignal {
        0% { opacity: 0.25; stroke-dashoffset: 0; }
        50% { opacity: 0.85; }
        100% { opacity: 0.25; stroke-dashoffset: -80; }
      }
      @keyframes waveBar {
        0%, 100% { height: 18px; y: 41px; }
        50% { height: 50px; y: 25px; }
      }

      .floating-orb-1 {
        animation: floatSlow 7s ease-in-out infinite;
      }
      .floating-orb-2 {
        animation: floatReverse 9s ease-in-out infinite;
      }
      .signal-line {
        stroke-dasharray: 12 8;
        animation: pulseSignal 4s linear infinite;
      }
      .bar-1 { animation: waveBar 1.2s ease-in-out infinite; }
      .bar-2 { animation: waveBar 1.6s ease-in-out infinite 0.2s; }
      .bar-3 { animation: waveBar 1.1s ease-in-out infinite 0.4s; }
      .bar-4 { animation: waveBar 1.5s ease-in-out infinite 0.1s; }
      .bar-5 { animation: waveBar 1.3s ease-in-out infinite 0.5s; }
      .bar-6 { animation: waveBar 1.7s ease-in-out infinite 0.3s; }
      .bar-7 { animation: waveBar 1.0s ease-in-out infinite 0.2s; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <g class="floating-orb-1">
    <circle cx="200" cy="100" r="140" fill="#0284c7" opacity="0.22" filter="url(#orbGlow)" />
  </g>
  <g class="floating-orb-2">
    <circle cx="1020" cy="300" r="160" fill="#7c3aed" opacity="0.25" filter="url(#orbGlow)" />
    <circle cx="850" cy="90" r="110" fill="#06b6d4" opacity="0.18" filter="url(#orbGlow)" />
  </g>

  <!-- Telephony / Network Connection Lines in Background -->
  <g opacity="0.4" stroke-width="2">
    <path class="signal-line" d="M 120 330 Q 350 250 600 320 T 1080 270" fill="none" stroke="url(#primaryGrad)" />
    <path class="signal-line" d="M 80 180 Q 400 90 750 160 T 1120 110" fill="none" stroke="#38bdf8" />
  </g>

  <!-- Network Nodes Graphic in Background Corner -->
  <g transform="translate(940, 60)" opacity="0.85">
    <!-- Center PBX Cloud Node -->
    <circle cx="120" cy="110" r="42" fill="url(#cyanGrad)" stroke="#38bdf8" stroke-width="2" />
    <path d="M 105 105 A 15 15 0 0 1 135 105 A 11 11 0 0 1 143 118 A 6 6 0 0 1 138 123 L 102 123 A 7 7 0 0 1 99 113 A 12 12 0 0 1 105 105 Z" fill="#ffffff" />
    
    <!-- Connected Satellite Nodes -->
    <line x1="120" y1="68" x2="120" y2="35" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="120" cy="25" r="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    
    <line x1="150" y1="135" x2="190" y2="170" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="200" cy="180" r="14" fill="#1e1b4b" stroke="#c084fc" stroke-width="2" />

    <line x1="85" y1="130" x2="45" y2="165" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="35" cy="175" r="12" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2" />

    <!-- Audio Waveform Visualizer -->
    <g transform="translate(65, 175)">
      <rect class="bar-1" x="0" y="30" width="5" height="20" rx="2.5" fill="#38bdf8" />
      <rect class="bar-2" x="10" y="25" width="5" height="30" rx="2.5" fill="#818cf8" />
      <rect class="bar-3" x="20" y="20" width="5" height="40" rx="2.5" fill="#c084fc" />
      <rect class="bar-4" x="30" y="15" width="5" height="50" rx="2.5" fill="#38bdf8" />
      <rect class="bar-5" x="40" y="22" width="5" height="36" rx="2.5" fill="#818cf8" />
      <rect class="bar-6" x="50" y="28" width="5" height="24" rx="2.5" fill="#c084fc" />
      <rect class="bar-7" x="60" y="33" width="5" height="14" rx="2.5" fill="#38bdf8" />
    </g>
  </g>

  <!-- FOREGROUND: Safe and Clear Title & Subtitles -->
  <g transform="translate(80, 80)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8" />
    <text x="32" y="21" class="tag-text" fill="#38bdf8">CLOUD TELEPHONY &amp; VOIP</text>

    <!-- Main Title -->
    <text x="0" y="95" class="title-text" fill="#ffffff">
      Awesome Cloud Business Phone System
    </text>
    <text x="0" y="150" class="title-text" fill="url(#primaryGrad)">
      &amp; VoIP Solutions
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="200" class="subtitle-text">
      Curated directory of SaaS enterprise PBX platforms &amp; open-source telephony frameworks
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 235)">
      <!-- Pill 1: Cloud PBX -->
      <rect x="0" y="0" width="125" height="34" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="14" y="22" class="tag-text">📞 Cloud PBX</text>

      <!-- Pill 2: UCaaS -->
      <rect x="135" y="0" width="105" height="34" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="149" y="22" class="tag-text">🌐 UCaaS</text>

      <!-- Pill 3: SIP / WebRTC -->
      <rect x="250" y="0" width="145" height="34" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="264" y="22" class="tag-text">⚡ SIP &amp; WebRTC</text>

      <!-- Pill 4: Open Source -->
      <rect x="405" y="0" width="145" height="34" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="419" y="22" class="tag-text">🔓 Open Source</text>

      <!-- Pill 5: AI Telephony -->
      <rect x="560" y="0" width="145" height="34" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="574" y="22" class="tag-text">🤖 AI Telephony</text>
    </g>
  </g>
</svg>
